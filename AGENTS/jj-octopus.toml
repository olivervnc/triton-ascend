# jj "ladder" octopus workflow: one PR = one code chain + one doc ladder.
#
#   armbase() ──► P1 ─────────► P2 ─────────► P3        bookmark: <pr>   (pure code, pushable)
#                   \            \             \
#   localbase() ──► H1 ────────► H2 ─────────► H3       bookmark: hack-<pr>
#                                              \
#                                               ──► @    merge of every `hack-<pr>`
#
# Every H_k is a strict 2-parent merge of H_{k-1} (H_0 = localbase()) and P_k, so
# the graph has no 3-way node and no `mega-<pr>` bookmark: the ladder node H_k IS
# the merge point of step k. Each H_k carries the docs written for step k, which
# makes "code P_k <-> docs of step k" a graph edge instead of something to
# remember: `jj mgo <P_k>` lands the working copy on H_k, where the code of
# P_1..P_k, the local layer (build patch, local hacks) and the docs of steps
# 1..k are present at once. `jj mback` sends the result back to both sides.
#
# Two knobs, with triton-ascend's values below -- edit both for another repo:
#   `armbase()`   what the code chains are based on. `trunk()` keeps PR branches
#                 on the local merge target; an upstream branch such as
#                 `main-dev@upstream` makes them reviewable upstream as-is.
#   `localbase()` tip of the local layer, i.e. the bookmark `mland` sediments
#                 docs into and the ladder's left root. It must resolve to a
#                 commit carrying a *local* bookmark: `mland` moves it by name,
#                 so a remote bookmark such as `main@origin` cannot serve.
#
# This fragment is NOT repo-agnostic: the two knobs and the `private-commits`
# bookmark names are triton-ascend's. Install it per repository, MERGING the keys
# into the existing tables instead of appending the whole file: TOML forbids the
# same [table] header twice, and this repo's config already declares
# [revset-aliases] (for `trunk()`), so a plain append makes jj refuse to load it
# (TOML parse error ... duplicate key). The merge script lives in
# AGENTS/JjOctopus.md section 1. jj 0.46 reads repo config from
# ~/.config/jj/repos/<config-id>/config.toml (see `jj config path --repo`) and
# silently ignores .jj/repo/config.toml. Appending it to the global config
# breaks every other repo -- `jj mnew` stops at
# Error: Revision `main-dev@upstream` doesn't exist, and an absent `localbase()`
# bookmark resolves to an empty revset, so `jj new 'localbase()'` reports
# Error: No revisions found to use as parent. To reuse it repo-agnostically, keep
# a copy whose knobs are `'trunk()'` with a local `localbase()` bookmark, install
# that globally, and override both keys in each repo's config (a later config
# layer wins for the same key).
#
# Requires: a `trunk()` alias pointing at the branch PRs merge into
# (`main@origin`; `localhack@origin` when the base branch itself is the merge
# target, as in this repo) and a local bookmark at `localbase()`.

[fileset-aliases]
# Paths that live on the private arm. `**/` also matches the repo root, so the
# top-level `AGENTS.md` and `AGENTS/**` are covered without extra patterns.
private = 'glob:"**/AGENTS.md" | glob:"**/AGENTS/**" | glob:"**/CLAUDE.md" | glob:"**/.agents/**"'

[revset-aliases]
# 代码链基座：想直接基于上游 `main-dev` 提 PR 就改成 `'main-dev@upstream'`，
# 想让 PR 分支跟着 `trunk()` 走就写 `'trunk()'`。换仓库时改这一行。
"armbase()" = 'main-dev@upstream'
# 本地层尖端：本地 hack（构建补丁、调试开关）与文档沉淀都挂在它上面，阶梯的左根。
# 本仓库是 `debug`（`localhack` 的子提交）；换仓库时改这一行。
"localbase()" = 'bookmarks(exact:"debug")'
# H_k 的代码父 P_k：先按结构去掉阶梯父（H_{k-1} 是 merge，P_k 不是），再排除「只存在于
# 本地层、没上过远端」的提交。H_1 的另一个父是本地层根：本地层被平移到新 trunk 后，
# 代码提交反而成了 localbase() 的祖先，只有「在远端书签祖先里」这一条能区分两者。
"paired_code(h)" = '(parents(h) ~ merges()) ~ ((::localbase()) ~ (::remote_bookmarks()))'
# P_k 的阶梯节点 H_k：代码提交的子提交里唯一的 merge。
"paired_hack(p)" = 'children(p) & merges()'
# 一个 PR 的全部阶梯节点没有单独别名：revset 不支持字符串拼接，所以
# `hack_chain(pr)` 这种按名字拼 `hack-<pr>` 的写法不成立，调用点直接写
#   (::bookmarks(exact:"hack-<pr>")) & merges() & ~(::armbase() | ::localbase())
# 即"去掉 armbase 与 localbase 的祖先后剩下的 merge"，只可能是 H_1..H_n。

[git]
# Guard rail: nothing on the local layer may be pushed. `private-commits` only
# filters `jj git push` (it never blocks rewriting), so `localbase()::` is safe
# here: it covers every ladder node and `@`, while the code chains stay pushable
# (they descend from `armbase()`, not from the local layer). Do NOT write
# `armbase()::` -- in this repo the local layer descends from `main-dev@upstream`
# too, so that form would classify the whole tree as private.
# `mega-*` is only here to lock leftovers of the pre-ladder layout.
private-commits = 'localbase():: | bookmarks(exact:"localhack") | bookmarks(glob:"mega-*")'

[aliases]
# ---------------------------------------------------------------------------
# mmega -- internal: re-root every ladder on the current `localbase()`, then
# re-merge `@` on top of all `hack-*` tips. One pair is registered per
# `hack-<pr>` bookmark that has a matching `<pr>` bookmark.
# ---------------------------------------------------------------------------
mmega = ["util", "exec", "--", "sh", "-c", '''
set -eu
if [ -n "$(jj diff -r @ --name-only)" ]; then
  echo "mmega: @ 还有未归位改动，先跑 jj mput <PR> 或 jj mback" >&2
  exit 1
fi
for m in $(jj bookmark list 'glob:"mega-*"' -T 'name ++ "\n"'); do
  jj bookmark delete "$m" >/dev/null 2>&1 || true
done
for h in $(jj bookmark list 'glob:"hack-*"' -T 'name ++ "\n"'); do
  pr="${h#hack-}"
  [ -n "$(jj bookmark list "exact:$pr" -T 'name')" ] || continue
  h1=$(jj log -r "roots((::bookmarks(exact:\"$h\")) & merges() & ~(::armbase() | ::localbase()))" --no-graph -T 'change_id ++ "\n"' | head -1)
  [ -n "$h1" ] || continue
  p1=$(jj log -r "roots((::bookmarks(exact:\"$pr\")) & ~(::armbase()))" --no-graph -T 'change_id ++ "\n"' | head -1)
  cur=$(jj log -r "parents(change_id(\"$h1\")) & (::localbase())" --no-graph -T 'commit_id ++ "\n"' | head -1)
  want=$(jj log -r 'localbase()' --no-graph -T 'commit_id ++ "\n"' | head -1)
  if [ -n "$p1" ] && [ "$cur" != "$want" ]; then
    jj rebase -s "change_id(\"$h1\")" -o 'localbase()' -o "change_id(\"$p1\")" >/dev/null
    echo "阶梯 $h 已对齐到最新 localbase"
  fi
done
cur=$(jj log -r '@-' --no-graph -T 'change_id.short() ++ "\n"' | sort | tr '\n' ' ')
want=$(jj log -r 'bookmarks(glob:"hack-*")' --no-graph -T 'change_id.short() ++ "\n"' | sort | tr '\n' ' ')
if [ -n "$want" ] && [ "$cur" != "$want" ]; then
  jj new 'bookmarks(glob:"hack-*")' >/dev/null
elif [ -z "$want" ] && [ -n "$cur" ]; then
  jj new 'localbase()' >/dev/null
fi
''', ""]

# ---------------------------------------------------------------------------
# mnew <pr> ["message"] -- open the pair: P1 on `armbase()`, H1 = merge of
# `localbase()` and P1. Two parents, no `mega-<pr>`, no redundant local layer
# edge (`jj new` keeps an ancestor passed as an explicit parent, so H1 must not
# list `localbase()` twice).
# ---------------------------------------------------------------------------
mnew = ["util", "exec", "--", "sh", "-c", '''
set -eu
pr="${1:-}"
if [ -z "$pr" ]; then
  echo "用法: jj mnew <PR名称> [\"提交描述\"]" >&2
  exit 1
fi
msg="${2:-feat: $pr}"
if [ -n "$(jj diff -r @ --name-only)" ]; then
  echo "mnew: @ 还有未归位改动，先跑 jj mput <PR> 或 jj mback" >&2
  exit 1
fi
jj bookmark forget "exact:$pr" >/dev/null 2>&1 || true
jj bookmark forget "exact:hack-$pr" >/dev/null 2>&1 || true
jj new 'armbase()' -m "$msg" >/dev/null
jj bookmark create "$pr" -r @ >/dev/null
jj new 'localbase()' "bookmarks(exact:\"$pr\")" -m "hack: $msg" >/dev/null
jj bookmark create "hack-$pr" -r @ >/dev/null
jj mmega
echo "开启完成(二叉阶梯): $pr (代码, 基于 armbase) + hack-$pr (merge localbase 与 $pr), @ 已在全部 hack-* 之上"
''', ""]

# ---------------------------------------------------------------------------
# mput <pr> [--absorb] -- split `@`: `~private` into the `<pr>` tip, the rest
# into the `hack-<pr>` tip. `--absorb` first runs `jj absorb` so touched lines
# land in the code commit that introduced them instead of the tip.
# ---------------------------------------------------------------------------
mput = ["util", "exec", "--", "sh", "-c", '''
set -eu
pr="${1:-}"
if [ -z "$pr" ]; then
  echo "用法: jj mput <PR名称> [--absorb]" >&2
  exit 1
fi
if [ "${2:-}" = "--absorb" ] && [ -n "$(jj diff -r @ --name-only '~private')" ]; then
  # `jj absorb` exits non-zero when nothing is absorbable (a doc-only `@`, a
  # conflict, or a line no commit in the range introduced); that must not abort
  # the routing below, so the failure is reported instead of fatal.
  jj absorb --into "(::bookmarks(exact:\"$pr\")) ~ (::armbase())" '~private' >/dev/null 2>&1 \
    || echo "mput: jj absorb 未能把改动下沉到某个代码提交，按尖端 squash 处理" >&2
fi
if [ -n "$(jj diff -r @ --name-only '~private')" ]; then
  jj squash -u --from @ --into "bookmarks(exact:\"$pr\")" '~private'
fi
if [ -n "$(jj diff -r @ --name-only)" ]; then
  jj squash -u --from @ --into "bookmarks(exact:\"hack-$pr\")"
fi
echo "归位完成: 代码 -> $pr; 文档 -> hack-$pr"
''', ""]

# ---------------------------------------------------------------------------
# mcommit <pr> "message" -- append one ladder step: P_{k+1} becomes a new commit
# on top of P_k and H_{k+1} = merge(H_k, P_{k+1}) becomes the new `hack-<pr>` tip.
# The docs currently in `@` belong to this new step, so they are squashed into
# H_{k+1} *after* it exists and owns the bookmark -- each node then holds exactly
# its own step's docs.
# ---------------------------------------------------------------------------
mcommit = ["util", "exec", "--", "sh", "-c", '''
set -eu
pr="${1:-}"
msg="${2:-}"
if [ -z "$pr" ] || [ -z "$msg" ]; then
  echo "用法: jj mcommit <PR名称> \"<提交信息>\"" >&2
  exit 1
fi
if [ -z "$(jj diff -r @ --name-only '~private')" ]; then
  echo "mcommit: @ 没有代码改动；只改文档时直接跑 jj mput $pr" >&2
  exit 1
fi
pr_head=$(jj log -r "bookmarks(exact:\"$pr\")" --no-graph -T 'change_id ++ "\n"')
hack_head=$(jj log -r "bookmarks(exact:\"hack-$pr\")" --no-graph -T 'change_id ++ "\n"')
# `jj split` puts the selected (code) changes on a new child of `<pr>`; `@` keeps
# the docs, so they can be squashed into H_k before the next node is built.
jj split -r @ -o "change_id(\"$pr_head\")" '~private' -m "$msg" >/dev/null
new_p=$(jj log -r "children(change_id(\"$pr_head\")) ~ merges()" --no-graph -T 'change_id ++ "\n"' | head -1)
jj bookmark set "$pr" -r "change_id(\"$new_p\")" >/dev/null
# `@` now holds this step's docs only; build H_{k+1} first so the docs land in the
# node they belong to, then move them over from the old working-copy commit.
wc_id=$(jj log -r @ --no-graph -T 'change_id ++ "\n"')
jj new "change_id(\"$hack_head\")" "change_id(\"$new_p\")" -m "hack: $msg" >/dev/null
jj bookmark set "hack-$pr" -r @ >/dev/null
if [ -n "$(jj diff -r "change_id(\"$wc_id\")" --name-only)" ]; then
  jj squash -u --from "change_id(\"$wc_id\")" --into "bookmarks(exact:\"hack-$pr\")"
fi
# A node must never be `@`: every command's "is `@` clean" guard reads `@`'s own
# diff, so leave a fresh empty working copy on top of the ladder.
jj new 'bookmarks(glob:"hack-*")' >/dev/null
jj mmega
echo "阶梯追加完成: $pr 新增代码提交「$msg」, 并配对二叉节点 hack-$pr"
''', ""]

# ---------------------------------------------------------------------------
# mgo <rev> -- enter a ladder step for conflict resolution or single-step
# debugging. Accepts either the code commit P_k or the ladder node H_k and always
# lands `@` on H_k, where code of steps 1..k, the local layer and the docs of
# steps 1..k are all present.
# ---------------------------------------------------------------------------
mgo = ["util", "exec", "--", "sh", "-c", '''
set -eu
rev="${1:-}"
if [ -z "$rev" ]; then
  echo "用法: jj mgo <P_k 或 H_k>" >&2
  exit 1
fi
if [ -n "$(jj diff -r @ --name-only)" ]; then
  echo "mgo: @ 还有未归位改动，先跑 jj mput <PR> 或 jj mback" >&2
  exit 1
fi
if [ -n "$(jj log -r "($rev) & (localbase()::)" --no-graph -T 'change_id ++ "\n"')" ]; then
  h_node="$rev"
else
  h_node=$(jj log -r "paired_hack($rev)" --no-graph -T 'change_id ++ "\n"' | head -1)
  if [ -z "$h_node" ]; then
    echo "mgo: $rev 不是代码提交，也没有配对的阶梯节点" >&2
    exit 1
  fi
fi
p_node=$(jj log -r "paired_code(change_id(\"$h_node\"))" --no-graph -T 'change_id.short()' | head -1)
jj new "change_id(\"$h_node\")" >/dev/null
echo "已进入阶梯节点 $(jj log -r @- --no-graph -T 'change_id.short()') (代码提交: $p_node)。改完直接跑 jj mback"
''', ""]

# ---------------------------------------------------------------------------
# mback [--hack-only] -- leave the `mgo` state: `~private` back into P_k, docs
# and merge fixes into H_k, then rebuild `@` on top of every `hack-*` via mmega.
# ---------------------------------------------------------------------------
mback = ["util", "exec", "--", "sh", "-c", '''
set -eu
h_node=$(jj log -r '@-' --no-graph -T 'change_id ++ "\n"')
p_node=$(jj log -r 'paired_code(@-)' --no-graph -T 'change_id ++ "\n"' | head -1)
if [ -z "$p_node" ]; then
  echo "mback: 当前 @ 不在阶梯节点之上（先用 jj mgo 进入）" >&2
  exit 1
fi
if [ "${1:-}" != "--hack-only" ] && [ -n "$(jj diff -r @ --name-only '~private')" ]; then
  jj squash -u --from @ --into "change_id(\"$p_node\")" '~private'
fi
if [ -n "$(jj diff -r @ --name-only)" ]; then
  jj squash -u --from @ --into "change_id(\"$h_node\")"
fi
jj mmega
echo "归位完成: 代码 -> $p_node; 文档/合并修正 -> $h_node; @ 已回到全部 hack-* 之上"
''', ""]

# ---------------------------------------------------------------------------
# mland <pr> -- after the PR merged upstream: put the local layer on the newest
# `trunk()`, 3-way merge the arm's docs onto it by rebasing the ladder root onto
# `localbase()`, then append one `docs(<pr>): <step>` commit per ladder node so
# the per-commit doc mapping survives landing. Never rewrites the local layer.
# ---------------------------------------------------------------------------
mland = ["util", "exec", "--", 'sh', '-c', '''
set -eu
pr="${1:-}"
if [ -z "$pr" ]; then
  echo "用法: jj mland <已合入上游的PR名称>" >&2
  exit 1
fi
if [ -n "$(jj diff -r @ --name-only)" ]; then
  echo "mland: @ 还有未归位改动，先跑 jj mput <PR> 或 jj mback" >&2
  exit 1
fi
jj git fetch
lb=$(jj log -r 'localbase() & bookmarks()' --no-graph -T 'bookmarks' | tr ' ' '\n' | grep -v '@' | head -1)
if [ -z "$lb" ]; then
  echo "mland: localbase() 必须指向一个有本地书签的提交（当前没有）" >&2
  exit 1
fi
hack="bookmarks(exact:\"hack-$pr\")"
has_arm=0
if [ -n "$(jj log -r "$hack" --no-graph -T 'change_id ++ "\n"')" ]; then
  has_arm=1
  chain=$(jj log -r "(::bookmarks(exact:\"hack-$pr\")) & merges() & ~(::armbase() | ::localbase())" --no-graph -T 'change_id ++ "\n"' | tac || true)
  h1=$(echo "$chain" | head -1)
  # Identify P_1 (the code root) while the local layer is still the one the arm was
  # built on: the alignment below rewrites that layer, so afterwards the old root is
  # no longer an ancestor of `localbase()` and `parents(H1) ~ (::localbase())` would
  # become ambiguous.
  p1=$(jj log -r "parents(change_id(\"$h1\")) & ~(::localbase())" --no-graph -T 'change_id ++ "\n"' | head -1)
fi
# Put the local layer on the fetched `trunk()` before appending this PR's docs, so
# the sediment lands on the newest base. Three disjoint cases:
#   [Ahead]     already descends from `trunk()` -> nothing to do
#   [Behind]    plain ancestor of `trunk()`     -> fast-forward the bookmark
#   [Diverged]  own local commits               -> rebase those onto `trunk()`
if [ -z "$(jj log -r 'localbase() & trunk()::' --no-graph -T 'change_id ++ "\n"')" ]; then
  if [ -n "$(jj log -r 'localbase() & ::trunk()' --no-graph -T 'change_id ++ "\n"')" ]; then
    jj bookmark set "$lb" -r "trunk()" >/dev/null
    echo "本地层落后 trunk -> 书签 $lb 快进到 trunk"
  else
    jj rebase -o "trunk()" -s "roots(trunk()..localbase())" >/dev/null
    echo "本地层有自己的提交 -> 平移到新 trunk"
  fi
fi
sedimented=0
if [ "$has_arm" = 1 ] && [ -n "$(jj diff --from 'localbase()' --to "$hack" --name-only 'private')" ]; then
  # Re-root the ladder's first node on the fresh local layer (3-way) but keep its
  # code parent: the pairing must survive a conflicting rebase, otherwise
  # `mgo`/`mback` can no longer find P_1 and the arm is stuck.
  if [ -n "$p1" ]; then
    jj rebase -s "change_id(\"$h1\")" -o 'localbase()' -o "change_id(\"$p1\")" >/dev/null
  else
    jj rebase -s "change_id(\"$h1\")" -o 'localbase()' >/dev/null
  fi
  # If another PR landed into the same doc lines, the nodes now carry conflict
  # markers. Never restore those into the sediment -- that would write `<<<<<<<`
  # into the local layer while still reporting success.
  arm_nodes=$(echo "$chain" | sed 's/.*/change_id("&")/' | paste -sd'|' -)
  if [ -n "$(jj log -r "($arm_nodes) & conflicts()" --no-graph -T 'change_id ++ "\n"')" ]; then
    echo "mland: 阶梯节点与本地层在文档上冲突了，先 jj mgo <P_k> 解决并 jj mback，再重跑 mland（本次未沉淀）" >&2
    exit 1
  fi
  prev='localbase()'
  for h in $chain; do
    label=$(jj log -r "change_id(\"$h\")" --no-graph -T 'description.first_line()' | sed 's/^hack: *//')
    jj new "$prev" -m "docs($pr): $label" >/dev/null
    jj restore --from "change_id(\"$h\")" 'private' >/dev/null
    prev=@
  done
  jj bookmark set "$lb" -r @ >/dev/null
  jj new 'localbase()' >/dev/null
  sedimented=1
  echo "文档改动按阶梯逐步沉淀进 $lb（$(echo "$chain" | wc -w) 个提交）"
elif [ "$has_arm" = 1 ]; then
  echo "$pr 的文档臂没有 private 文件净改动，跳过沉淀"
fi
if [ "$has_arm" = 1 ]; then
  jj bookmark delete "hack-$pr" >/dev/null 2>&1 || true
  if [ -n "$chain" ]; then
    jj abandon $(echo "$chain" | tr '\n' ' ') >/dev/null 2>&1 || true
  fi
fi
jj bookmark delete "$pr" >/dev/null 2>&1 || true
jj mmega
# In-flight code chains follow `armbase()`, not `trunk()`: only re-attach them when
# both point at the same commit.
if [ "$(jj log -r 'armbase()' --no-graph -T 'commit_id ++ "\n"')" = "$(jj log -r 'trunk()' --no-graph -T 'commit_id ++ "\n"')" ]; then
  if ! jj rebase -o "trunk()" -s "roots(trunk()..mutable())" >/dev/null; then
    echo "错误: 在途 PR 未能平移到新 trunk，请手动 jj rebase（可能含不可改写提交）" >&2
    exit 1
  fi
fi
if [ "$sedimented" = 1 ]; then
  echo "$pr 已着陆: 文档按阶梯沉淀进 $lb, 阶梯已卸下, 其余在途 PR 已重建"
else
  echo "$pr 已着陆(无文档改动): 阶梯已卸下, 其余在途 PR 已重建"
fi
''', ""]
